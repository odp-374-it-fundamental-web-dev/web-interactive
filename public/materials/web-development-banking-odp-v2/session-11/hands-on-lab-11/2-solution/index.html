<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Web App — Milestone 5 (Solution)</title>
  <link rel="stylesheet" href="styles/main.css">
  <!-- Pemuatan skrip modular teruji -->
  <script src="scripts/next-history.js" defer></script>
  <script src="scripts/app.js" defer></script>
</head>
<body>
  <div class="weather-container">
    <h1>Informasi Cuaca Kota</h1>
    <p class="subtitle">Milestone 5: Pengerasan Kualitas, Pengujian Unit &amp; Integrasi.</p>

    <!-- FORM PENCARIAN -->
    <form id="formCuaca" class="search-form" novalidate>
      <label for="kota" class="sr-only" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;">Nama kota</label>
      <input id="kota" class="input-kota" placeholder="Ketik nama kota (mis: Jakarta, Surabaya)" required minlength="2">
      <button id="cariCuaca" class="btn-search" type="submit">Cari Cuaca</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <div id="hasilCuaca"></div>

    <!-- AREA RIWAYAT PENCARIAN -->
    <section class="history-section">
      <div class="history-header">
        <h3>Riwayat Kota Terakhir (Maks. 5)</h3>
        <button id="hapusRiwayat" class="btn-clear" type="button">Hapus Riwayat</button>
      </div>
      <div id="riwayatKota" class="history-list"></div>
    </section>

    <footer class="attribution">
      Weather data by <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo.com</a>
    </footer>
  </div>
</body>
</html>
