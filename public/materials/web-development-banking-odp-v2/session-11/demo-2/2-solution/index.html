<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 2: Storage Startup Bug Fix (Solution)</title>
  <script src="scripts/app.js" defer></script>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 500px; margin: 0 auto; line-height: 1.5; color: #1e293b; }
    .badge { display: inline-block; padding: 0.35rem 0.65rem; background: #e0f2fe; color: #0369a1; border-radius: 6px; margin: 0.25rem; font-weight: 600; font-size: 0.85rem; border: 1px solid #bae6fd; }
    button { padding: 0.5rem 1rem; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; margin-right: 0.5rem; }
    .btn-add { background: #1d3d70; color: white; }
    .btn-reload { background: #64748b; color: white; }
    .btn-clear { background: #fee2e2; color: #991b1b; }
    .card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Perbaikan Bug Persistensi Storage</h1>
  <p>Data riwayat sekarang tetap bertahan utuh saat halaman direfresh!</p>

  <div>
    <button id="btnTambah" class="btn-add">Tambah Kota ke Riwayat</button>
    <button id="btnReload" class="btn-reload" onclick="location.reload()">Reload (F5)</button>
    <button id="btnHapus" class="btn-clear">Hapus Riwayat</button>
  </div>

  <div class="card">
    <h3>Daftar Riwayat Tersimpan:</h3>
    <div id="daftar"></div>
  </div>
</body>
</html>
