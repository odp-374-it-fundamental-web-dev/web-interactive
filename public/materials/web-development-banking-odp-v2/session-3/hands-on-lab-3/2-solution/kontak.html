<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hubungi Kami - BNI ODP IT</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="brand">
        <span class="logo-text">BNI</span>
        <span class="badge">ODP IT 2026</span>
      </div>

      <ul class="nav-links">
        <li><a href="index.html">Kembali ke Profil</a></li>
        <li><a href="kontak.html" class="btn-nav">Hubungi Saya</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="form-wrapper">
      <h1>Hubungi Trainee ODP IT</h1>
      <p>Kirimkan pesan atau pertanyaan seputar proyek latihan pelatihan perbankan digital.</p>

      <form action="#" method="POST" class="contact-form">
        <div class="form-group">
          <label for="namaLengkap">Nama Lengkap:</label>
          <input type="text" id="namaLengkap" name="nama_lengkap" required minlength="3" placeholder="Contoh: Budi Santoso">
        </div>

        <div class="form-group">
          <label for="emailPengirim">Email Resmi Perusahaan:</label>
          <input type="email" id="emailPengirim" name="email_pengirim" required placeholder="nama@bni.co.id">
        </div>

        <div class="form-group">
          <label for="topikPesan">Topik Pertanyaan / Diskusi:</label>
          <select id="topikPesan" name="topik_pesan" required>
            <option value="">-- Pilih Topik Layanan --</option>
            <option value="konsultasi">Konsultasi Materi Pelatihan</option>
            <option value="kolaborasi">Kolaborasi Proyek Tim</option>
            <option value="keamanan">Kepatuhan Standar Keamanan Data</option>
            <option value="lainnya">Topik Lainnya</option>
          </select>
        </div>

        <div class="form-group">
          <label for="isiPesan">Deskripsi Pesan (Minimal 10 Karakter):</label>
          <textarea id="isiPesan" name="isi_pesan" rows="4" required minlength="10" placeholder="Tuliskan pesan atau pertanyaan Anda secara rinci..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Kirim Pesan</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 PT Bank Negara Indonesia (Persero) Tbk. Latihan Web Development ODP IT.</p>
  </footer>
</body>
</html>
