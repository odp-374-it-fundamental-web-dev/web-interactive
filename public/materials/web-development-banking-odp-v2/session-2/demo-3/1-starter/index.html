<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulasi Keamanan Form HTTP - BNI ODP IT</title>
</head>
<body>
  <h1>Simulasi Portal Login Trainee</h1>

  <!-- PERINGATAN KEAMANAN: Halaman latihan menggunakan data fiktif. Jangan masukkan password asli! -->
  <p style="color: red;">
    <strong>PERHATIAN:</strong> Jangan pernah memasukkan kata sandi atau data kredensial nyata!
  </p>

  <!-- 
    TODO 1: Ubah method="GET" menjadi method="POST"
    Saat method="GET", kredensial rahasia akan bocor di URL browser!
  -->
  <form action="#" method="GET">
    <div>
      <label for="usernameInput">ID Pengguna (Fiktif):</label><br>
      <input type="text" id="usernameInput" name="user_id" required placeholder="Contoh: trainee01">
    </div>

    <br>

    <div>
      <label for="passwordInput">Kata Sandi Simulasi (Fiktif):</label><br>
      <!-- TODO 2: Tambahkan atribut autocomplete="current-password" atau autocomplete="off" -->
      <input type="password" id="passwordInput" name="user_pin" required placeholder="Minimal 6 karakter">
    </div>

    <br>

    <button type="submit">Masuk ke Portal Latihan</button>
  </form>
</body>
</html>
