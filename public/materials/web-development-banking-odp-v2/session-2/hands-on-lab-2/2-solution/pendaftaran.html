<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Pelatihan Internal - BNI L&amp;D IT</title>
</head>
<body>
  <header>
    <h1>Formulir Pendaftaran Pelatihan Internal IT</h1>
    <p>Portal Learning &amp; Development - PT Bank Negara Indonesia (Persero) Tbk</p>
  </header>

  <nav>
    <a href="index.html">Kembali ke Profil</a> |
    <a href="kontak.html">Hubungi Trainee</a>
  </nav>

  <main>
    <form action="#" method="POST">
      <div>
        <label for="regNama">Nama Lengkap Peserta:</label><br>
        <input type="text" id="regNama" name="nama_peserta" required minlength="3" placeholder="Nama lengkap">
      </div>

      <br>

      <div>
        <label for="regEmail">Email Resmi Kantor (@bni.co.id):</label><br>
        <input type="email" id="regEmail" name="email_kantor" required placeholder="user@bni.co.id">
      </div>

      <br>

      <div>
        <label for="regModul">Pilihan Modul Pelatihan:</label><br>
        <select id="regModul" name="modul_pelatihan" required>
          <option value="">-- Pilih Modul Pelatihan --</option>
          <option value="web-dev">Web Development Fundamentals (HTML/CSS/JS)</option>
          <option value="cloud-backend">Cloud-Native Microservices &amp; REST APIs</option>
          <option value="security">DevSecOps &amp; Banking Data Security</option>
        </select>
      </div>

      <br>

      <div>
        <label for="regMotivasi">Alasan / Harapan Mengikuti Pelatihan (Minimal 10 Karakter):</label><br>
        <textarea id="regMotivasi" name="motivasi_belajar" rows="4" cols="45" required minlength="10" placeholder="Jelaskan target pencapaian Anda..."></textarea>
      </div>

      <br>

      <button type="submit">Daftar Pelatihan</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 BNI Corporate University. Formulir pendaftaran internal ODP IT.</p>
  </footer>
</body>
</html>
