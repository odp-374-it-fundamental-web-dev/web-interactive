<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan Form Dasar - BNI ODP IT</title>
</head>
<body>
  <h1>Formulir Permintaan Informasi</h1>

  <!-- 
    TODO 1: Bungkus input ke dalam tag <form action="#" method="POST">
  -->
  <div>
    <!-- 
      TODO 2: Buat elemen <label for="namaLengkap">Nama Lengkap</label>
      TODO 3: Berikan id="namaLengkap" dan name="nama_lengkap" pada input di bawah
    -->

    <br><br>

    <!--

    -->

    <input type="email" placeholder="nama@bni.co.id">

    <br><br>

    <!-- TODO 6: Ubah tombol menjadi <button type="submit">Kirim Formulir</button> -->
    <button>Kirim</button>
  </div>
