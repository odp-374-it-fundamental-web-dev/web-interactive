<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan Form Dasar - BNI ODP IT</title>
</head>
<body>
  <h1>Formulir Permintaan Informasi</h1>

  <form action="#" method="POST">
    <div>
      <label for="namaLengkap">Nama Lengkap:</label><br>
      <input type="text" id="namaLengkap" name="nama_lengkap" placeholder="Contoh: Budi Santoso">
    </div>

    <br>

    <div>
      <label for="emailKantor">Email Perusahaan:</label><br>
      <input type="email" id="emailKantor" name="email_kantor" placeholder="nama@bni.co.id">
    </div>

    <br>

    <button type="submit">Kirim Formulir</button>
  </form>
</body>
</html>
