<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 4: Dynamic List Rendering (Solution)</title>
  <script src="scripts/app.js" defer></script>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 500px; margin: 0 auto; line-height: 1.5; color: #1e293b; }
    form { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; background: #f8fafc; padding: 1.25rem; border-radius: 8px; border: 1px solid #e2e8f0; }
    label { font-weight: 600; font-size: 0.9rem; }
    input { padding: 0.6rem; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { padding: 0.7rem; font-size: 1rem; border-radius: 6px; border: none; background: #1d3d70; color: white; font-weight: 600; cursor: pointer; }
    button:hover { background: #152d53; }
    #pesan { font-weight: 600; font-size: 0.9rem; min-height: 1.5rem; margin: 0; }
    .pesan-error { color: #dc2626; }
    .pesan-sukses { color: #16a34a; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 0.75rem; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <h1>Catat Transaksi Kas</h1>

  <form id="formTransaksi" novalidate>
    <label for="nama">Nama Transaksi</label>
    <input id="nama" name="nama" required placeholder="Contoh: Setoran Latihan">

    <label for="nominal">Nominal (IDR)</label>
    <input id="nominal" name="nominal" type="number" required placeholder="50000">

    <button type="submit">Tambahkan Transaksi</button>
    <p id="pesan" role="status" aria-live="polite"></p>
  </form>

  <h2>Daftar Transaksi</h2>
  <ul id="daftarTransaksi"></ul>
</body>
</html>
