<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hands-on Lab 8: Portal Transaksi & Milestone 2 (Solution)</title>
  <link rel="stylesheet" href="styles/main.css">
  <!-- Pemuatan skrip dengan defer menjamin parsing DOM selesai sebelum eksekusi -->
  <script src="scripts/app.js" defer></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Portal Transaksi & Katalog BNI ODP</h1>
      <p>Aplikasi pengelolaan kas transaksi dan katalog pelatihan perbankan IT 2026.</p>
    </header>

    <!-- SECTION 1: FORM TRANSAKSI KAS -->
    <section class="card">
      <h2>Catat Transaksi Finansial</h2>
      <form id="formTransaksi" novalidate>
        <div class="form-group">
          <label for="nama">Nama Transaksi</label>
          <input id="nama" name="nama" type="text" placeholder="Contoh: Setoran Latihan" required>
        </div>

        <div class="form-group">
          <label for="nominal">Nominal (IDR)</label>
          <input id="nominal" name="nominal" type="number" placeholder="Contoh: 50000" required>
        </div>

        <button type="submit" class="btn-primary">Tambahkan Transaksi</button>
        <p id="pesan" role="status" aria-live="polite"></p>
      </form>

      <h3>Daftar Transaksi Kas</h3>
      <ul id="daftarTransaksi" class="item-list"></ul>
    </section>

    <!-- SECTION 2: MILESTONE 2 & CHALLENGE MANDIRI -->
    <section class="card">
      <h2>Milestone 2: Pencarian & Filter Pelatihan Real-Time</h2>
      
      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem; margin-bottom: 1rem;">
        <div class="form-group" style="margin-bottom: 0;">
          <label for="cari">Cari Pelatihan</label>
          <input id="cari" type="text" placeholder="Ketik nama atau kategori...">
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label for="filterKategori">Filter Kategori (Challenge)</label>
          <select id="filterKategori">
            <option value="Semua">Semua Kategori</option>
            <option value="Web">Web</option>
            <option value="Data">Data</option>
          </select>
        </div>
      </div>

      <h3>Hasil Katalog</h3>
      <ul id="hasil" class="item-list"></ul>
    </section>
  </div>
</body>
</html>
