<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 2: Safe DOM Modification & Security (Solution)</title>
  <script src="scripts/app.js" defer></script>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 600px; margin: 0 auto; line-height: 1.6; }
    .status-badge { display: inline-block; padding: 0.25rem 0.6rem; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
    .aktif { background-color: #dcfce7; color: #166534; }
    .terblokir { background-color: #fee2e2; color: #991b1b; }
    .card { border: 1px solid #cbd5e1; border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
    button { padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid #0284c7; background: #0284c7; color: white; cursor: pointer; font-weight: 600; }
    button:hover { background: #0369a1; }
    .alert-box { background-color: #f8fafc; border-left: 4px solid #64748b; padding: 0.75rem; margin-top: 1rem; font-family: monospace; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Status Kartu Debit BNI</h1>
  
  <div class="card" id="kartuNasabah">
    <p>Pemegang: <strong id="namaPemegang">Ahmad Dahlan</strong></p>
    <p>Status: <span id="badgeStatus" class="status-badge aktif">AKTIF</span></p>
    <p>Catatan Keamanan (Aman via <code>textContent</code>):</p>
    <div id="catatanKeamanan" class="alert-box"></div>
  </div>

  <button id="btnToggleStatus">Ubah Status Kartu</button>
</body>
</html>
