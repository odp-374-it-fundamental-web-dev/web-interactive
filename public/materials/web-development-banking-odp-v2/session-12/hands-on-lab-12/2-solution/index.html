<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Kurs Rupiah — Mini Capstone (Solution)</title>
  <!-- Jalur relatif untuk kesiapan deployment subpath (GitHub Pages / Vercel / Netlify) -->
  <link rel="stylesheet" href="./styles/main.css">
  <script src="./scripts/rate-helper.js" defer></script>
  <script src="./scripts/next-history.js" defer></script>
  <script src="./scripts/app.js" defer></script>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Kalkulator Kurs Rupiah</h1>
      <p class="subtitle">Bank Negara Indonesia (BNI) ODP IT 2026 — Mini Capstone.</p>
    </header>

    <main>
      <!-- FORM KONVERSI KURS -->
      <form id="formKurs" class="search-form" novalidate>
        <label for="jumlah" class="sr-only">Jumlah</label>
        <input id="jumlah" class="input-jumlah" type="number" min="0" step="any" placeholder="Jumlah (mis: 100)" required>
        <label for="inputDasar" class="sr-only">Kode mata uang dasar</label>
        <input id="inputDasar" class="input-kode" type="text" placeholder="Kode dasar (mis: USD)" maxlength="3" required autocomplete="off">
        <label for="inputTujuan" class="sr-only">Kode mata uang tujuan</label>
        <input id="inputTujuan" class="input-kode" type="text" placeholder="Kode tujuan (mis: IDR)" maxlength="3" required autocomplete="off">
        <button id="konversiKurs" class="btn-search" type="submit">Konversi Kurs</button>
      </form>

      <!-- STATUS & NOTIFIKASI ARIA -->
      <p id="status" class="status-box" role="status" aria-live="polite"></p>

      <!-- KARTU HASIL KONVERSI -->
      <div id="hasilKurs"></div>

      <!-- RIWAYAT KONVERSI TERAKHIR -->
      <section class="history-section">
        <div class="history-header">
          <h3>Riwayat Pasangan Kurs Terakhir (Maks. 5)</h3>
          <button id="hapusRiwayat" class="btn-clear" type="button">Hapus Riwayat</button>
        </div>
        <div id="riwayatPair" class="history-list"></div>
      </section>
    </main>

    <footer class="attribution">
      Data kurs referensi disediakan secara publik oleh <a href="https://frankfurter.dev" target="_blank" rel="noopener noreferrer">Frankfurter.dev</a> (sumber: Bank Central Eropa).
    </footer>
  </div>
</body>
</html>
